<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Green Beauty</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3eee3;--card:#faf7f0;--ink:#1f3a2c;--mut:#6b7566;--g:#2f5d46;--g2:#dfe5d3;--line:#e3dccb;--on:#faf7f0;--bad:#9b3b2e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15221b;--card:#1e2e25;--ink:#ece6d6;--mut:#a3ad9c;--g:#8fbf9f;--g2:#2a3d31;--line:#2f4437;--on:#15221b;--bad:#e08a7c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15221b;--card:#1e2e25;--ink:#ece6d6;--mut:#a3ad9c;--g:#8fbf9f;--g2:#2a3d31;--line:#2f4437;--on:#15221b;--bad:#e08a7c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Jost,system-ui,sans-serif}
.app{max-width:440px;min-height:100vh;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}
@media(min-width:600px){body{background:#d8d4c4}.app{margin:20px auto;min-height:0;height:min(880px,calc(100vh - 40px));border-radius:32px;overflow:hidden;box-shadow:0 20px 60px #0003}}
header{display:flex;align-items:center;gap:10px;padding:14px 20px 6px}
header img{width:44px;height:44px;object-fit:contain;mix-blend-mode:multiply;border-radius:8px}
@media(prefers-color-scheme:dark){header img{mix-blend-mode:normal;background:#f3eee3;padding:2px}}
header b{font:600 22px 'Cormorant Garamond',Georgia,serif;letter-spacing:.04em}
header span{margin-left:auto;font-size:13px;color:var(--mut)}
main{flex:1;overflow-y:auto;padding:8px 20px 24px}
h1,h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;margin:12px 0 6px}
h1{font-size:30px;line-height:1.1}h2{font-size:21px}
p{margin:4px 0}.mut{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0}
.hero{background:var(--g);color:var(--on);border:0;border-radius:26px;padding:22px}
.hero .big{font:600 56px/1 'Cormorant Garamond',Georgia,serif}
.bar{height:8px;border-radius:8px;background:#ffffff33;overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;background:var(--on);border-radius:8px}
.card .bar{background:var(--g2)}.card .bar i{background:var(--g)}
.row{display:flex;align-items:center;gap:12px;justify-content:space-between}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--g2);border:0;border-radius:16px;padding:14px;text-align:left;color:var(--ink);font:inherit;cursor:pointer}
.tile b{display:block;font-size:16px}
button{font:inherit;cursor:pointer}
.btn{background:var(--g);color:var(--on);border:0;border-radius:999px;padding:10px 18px;font-weight:500}
.btn.alt{background:transparent;color:var(--g);border:1px solid var(--g)}.btn[disabled]{opacity:.4;cursor:default}
.tag{display:inline-block;font-size:12px;background:var(--g2);border-radius:999px;padding:2px 10px;margin:2px 4px 2px 0}
.pill{font-weight:500;color:var(--g);white-space:nowrap}
input,select{width:100%;font:inherit;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin:6px 0}
nav{display:flex;border-top:1px solid var(--line);background:var(--card);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;color:var(--mut);font-size:11px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current=true]{color:var(--g);font-weight:500}
.msg{border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--g2)}.msg.err{color:var(--bad);border:1px solid var(--bad);background:none}
.view{height:150px;border-radius:18px;margin:10px 0;display:grid;place-items:center;border:2px dashed var(--g);color:var(--mut);text-align:center;padding:10px}
.dot{width:40px;height:56px;border-radius:10px 10px 12px 12px;background:var(--g);margin:0 auto 8px;position:relative}.dot:before{content:"";position:absolute;left:14px;top:-12px;width:12px;height:12px;background:var(--g);border-radius:3px 3px 0 0}
.seg{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}.seg button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px}.seg button[aria-pressed=true]{background:var(--g);color:var(--on);border-color:var(--g)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.demo{font-size:12px;color:var(--mut);border-left:3px solid var(--g);padding-left:8px;margin:10px 0}
</style>
</head>

<div class="seg" style="margin-top:12px">${['GB-HCA-001','GB-SHA-002','GB-SER-003'].map(c=>`<button data-code="${c}">${c}</button>`).join('')}</div>${S.msg||''}
<p class="demo">Cada código gera pontos uma única vez, para evitar registros duplicados.</p>`},
miss(){return`<h1>Missões</h1><p class="mut">Complete desafios e ganhe pontos.</p>${S.miss.map(m=>`<div class="card"><div class="row"><span>${m.t}</span><span class="pill">+${m.p}</span></div><div class="row" style="margin-top:8px"><span class="mut">${m.done?'Concluída':'0/1'}</span>${m.done?'':`<button class="btn alt" data-m="${m.id}">${m.auto?'Ir para a ação':'Validar (demo)'}</button>`}</div></div>`).join('')}`},
rew(){const f=S.cat;return`<h1>Recompensas</h1><div class="card hero row"><div><div class="mut" style="color:inherit">Seus pontos</div><div class="big" style="font-size:44px">${S.pts}</div></div><span style="font-size:13px;max-width:150px">Pontos válidos por 12 meses. Resgate sem troca em dinheiro.</span></div>
<div class="seg">${['todos','produtos','descontos','experiências'].map(c=>`<button aria-pressed="${f==c}" data-cat="${c}">${c}</button>`).join('')}</div>${S.msg||''}
${S.rew.filter(r=>f=='todos'||r.k==f).map((r,i)=>`<div class="card row"><div><b>${r.n}</b><div class="mut">${r.c} pontos</div></div><button class="btn" data-r="${S.rew.indexOf(r)}" ${S.pts<r.c?'disabled':''}>Resgatar</button></div>`).join('')}
${S.redeemed.length?`<h2>Resgates</h2>${S.redeemed.map(r=>`<div class="card mut">${r} · cupom demonstrativo</div>`).join('')}`:''}`},
log(){return`<h1>Logística reversa</h1><p class="mut">Devolva embalagens vazias e acompanhe o status.</p>
<div class="card"><label class="mut">Embalagem</label><select id="rp">${S.prods.map(p=>`<option>${p.n}</option>`).join('')}</select><label class="mut">Ponto de coleta</label><select id="rl">${S.pts_c.map(p=>`<option>${p.n}</option>`).join('')}</select><button class="btn" data-act="ret">Registrar devolução</button></div>${S.msg||''}
<h2>Suas devoluções</h2>${S.rtn.length?S.rtn.map((r,i)=>`<div class="card"><b>${r.p}</b><p class="mut">${r.l}</p><div class="row"><span class="tag">${r.ok?'Validada':'Aguardando validação'}</span>${r.ok?'':`<button class="btn alt" data-v="${i}">Simular validação</button>`}</div></div>`).join(''):'<p class="mut">Nenhuma devolução registrada. Escolha uma embalagem acima para começar.</p>'}
<h2>Pontos de coleta</h2>${S.pts_c.map(p=>`<div class="card"><b>${p.n}</b><p class="mut">${p.a}</p></div>`).join('')}<p class="demo">Endereços de exemplo. Os pontos só são concedidos após a validação da devolução.</p>`},
imp(){const n=S.rtn.filter(r=>r.ok).length;return`<h1>Meu impacto</h1><div class="card"><b>Registrado no app</b><p>Embalagens devolvidas e validadas: <b>${n}</b></p><p>Pontos acumulados: <b>${S.xp}</b></p></div>
<div class="card"><b>Estimativas demonstrativas</b><p class="mut">Exemplo ilustrativo, não são dados reais.</p><p>Embalagens devolvidas: 8 · CO₂ evitado: 12 kg · Água economizada: 320 L</p></div>
<h2>Histórico</h2>${S.hist.map(h=>`<div class="card row"><div>${h.t}<div class="mut">${h.d}</div></div><span class="pill">+${h.p}</span></div>`).join('')}`},
edu(){return`<h1>Aprender</h1><p class="mut">Conteúdos curtos ligados à ODS 12: consumo e produção responsáveis.</p>${S.art.map(a=>`<div class="card"><b>${a[0]}</b><p class="mut">${a[1]}</p></div>`).join('')}<button class="btn" data-go="miss">Ver desafios</button>`},
me(){const[l]=lvl();return`<h1>Yasmin Sertori</h1><p class="mut">Nível ${l}</p><div class="grid"><div class="card"><b>${S.pts}</b><br><span class="mut">pontos</span></div><div class="card"><b>${S.miss.filter(m=>m.done).length}</b><br><span class="mut">missões</span></div></div>
${[['imp','Meu impacto e histórico'],['log','Logística reversa'],['prod','Produtos'],['edu','Aprender']].map(x=>`<button class="tile card" style="width:100%;margin:6px 0" data-go="${x[0]}">${x[1]}</button>`).join('')}
<h2>Configurações</h2><div class="seg"><button data-th="auto">Tema automático</button><button data-th="light">Claro</button><button data-th="dark">Escuro</button></div><p class="demo">Seus dados pessoais ficam apenas nesta sessão de demonstração.</p>`}};
function go(t){S.tab=t;S.msg=null;draw()}
function draw(){$('#hp').textContent=S.pts+' pts';$('#m').innerHTML=V[S.tab]();$('#m').scrollTop=0;
$('#nav').innerHTML=TABS.map(t=>`<button data-go="${t[0]}" aria-current="${t[0]==S.tab||(t[0]=='me'&&['imp','log','prod','edu'].includes(S.tab))}"><svg viewBox="0 0 24 24">${I[t[0]]}</svg>${t[1]}</button>`).join('')}
function scan(c){c=(c||'').trim().toUpperCase();const ok={'GB-HCA-001':0,'GB-SHA-002':1,'GB-SER-003':2}[c];
if(ok===undefined)S.msg='<div class="msg err">Código não reconhecido. Confira o código impresso na embalagem.</div>';
else if(S.scanned.has(c))S.msg='<div class="msg err">Este código já foi registrado. Cada embalagem pontua uma vez.</div>';
else{S.scanned.add(c);const p=S.prods[ok];add(50,'Leitura de QR Code');done('qr');S.msg=`<div class="msg"><b>+50 pontos validados</b><br>${p.n}<br>Origem: ${p.o}<br>Descarte: ${p.d}</div>`}draw()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
if(d.go)go(d.go);
else if(d.th){document.documentElement.dataset.theme=d.th=='auto'?'':d.th;if(d.th=='auto')delete document.documentElement.dataset.theme}
else if(d.cat){S.cat=d.cat;S.msg=null;draw()}
else if(d.code){$('#code').value=d.code;scan(d.code)}
else if(d.act=='scan')scan($('#code').value)
else if(d.act=='ret'){const p=$('#rp').value,l=$('#rl').value;S.rtn.unshift({p,l,ok:0});S.msg='<div class="msg">Devolução registrada. Leve a embalagem ao ponto escolhido: os pontos entram após a validação.</div>';draw()}
else if(d.v!==undefined){S.rtn[+d.v].ok=1;add(150,'Devolução de embalagem');done('ret');S.msg='<div class="msg"><b>+150 pontos</b> após validação (simulada nesta demonstração).</div>';draw()}
else if(d.m){const m=S.miss.find(x=>x.id==d.m);if(m.auto)go(d.m=='ret'?'log':'scan');else{done(d.m);draw()}}
else if(d.r!==undefined){const r=S.rew[+d.r];if(S.pts>=r.c){S.pts-=r.c;S.redeemed.push(r.n);S.hist.unshift({p:-r.c,t:'Resgate: '+r.n,d:'hoje'});S.msg=`<div class="msg"><b>Resgatado:</b> ${r.n}. Demonstração: nenhum cupom real foi emitido.</div>`;draw()}}});
draw();
</script>
</body>
</html>
